</html><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi pequeña niña 🐧</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffccd5;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* Corazones cayendo */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .hearts span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="red" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat;
            background-size: contain;
            animation: animate 10s linear infinite;
        }

        @keyframes animate {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        /* Contenedor principal */
        .container {
            text-align: center;
            z-index: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 3rem;
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        .penguin {
            font-size: 2rem;
            position: relative;
            top: -10px;
        }

        .penguin sup {
            font-size: 1rem;
            position: relative;
            top: -10px;
        }

        .question {
            font-size: 2.5rem;
            color: #ff4d6d;
            font-style: italic;
            margin-top: 20px;
        }

        /* Osito con corazón */
        .bear {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background: url('https://i.pinimg.com/originals/9d/4e/1d/9d4e1d8f8e8f8f8f8f8f8f8f8f8f8f8f.gif') no-repeat;
            background-size: contain;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Mensaje de agradecimiento */
        .message {
            display: none;
            margin-top: 20px;
            font-size: 2rem;
            color: #ff4d6d;
        }
    </style>
</head>
<body>
    <!-- Corazones cayendo -->
    <div class="hearts" id="hearts">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Contenedor principal -->
    <div class="container">
        <h1>Para mi pequeña niña <span class="penguin">🐧<sup>17</sup></span></h1>
        <p class="question">¿Puedo tener el placer de que en este 14 de febrero seas mi San Valentín?</p>
    </div>

    <!-- Osito con corazón -->
    <div class="bear"></div>

    <!-- Script para funcionalidades -->
    <script>
        // Generar corazones dinámicamente
        const heartsContainer = document.getElementById('hearts');
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('span');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 10 + 's';
            heartsContainer.appendChild(heart);
        }
    </script>
</body>
</html>
